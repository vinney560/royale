<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LyxMab | ViuLive Player</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/static/uploads/favicon.png" />
    <link rel="apple-touch-icon" href="/static/uploads/favicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="https://cdn.dashjs.org/v4.7.4/dash.all.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        :root {
            --fg: #e4edf2;
            --mut: #9bb0bb;
            --dim: #5a7a85;
            --ac: #5fd0ba;
            --red: #ef4444;
            --ok: #34d399;
            --glass: rgba(0, 0, 0, .68)
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            background: #000;
            color: var(--fg);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none
        }

        button {
            font-family: inherit;
            color: inherit;
            cursor: pointer
        }

        .hidden {
            display: none !important
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, .06)
        }

        #pc {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden
        }

        #player,
        #frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
            object-fit: contain
        }

        /* loading / error layer */
        #state {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: .9rem;
            text-align: center;
            padding: 1rem
        }

        #state.loading {
            display: flex;
            background: rgba(0, 0, 0, .55);
            pointer-events: none
        }

        #state.buffer {
            display: flex;
            pointer-events: none
        }

        #state.card {
            display: flex;
            background: radial-gradient(circle at 50% 40%, #13201f, #000 70%)
        }

        .ring {
            width: 54px;
            height: 54px;
            border: 4px solid rgba(95, 208, 186, .15);
            border-top-color: var(--ac);
            border-radius: 50%;
            animation: spin 1s linear infinite
        }

        .ring.sm {
            width: 22px;
            height: 22px;
            border-width: 3px;
            display: inline-block;
            vertical-align: middle;
            margin-right: .5rem
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .stmsg {
            color: var(--mut);
            font-size: .9rem
        }

        .cbox {
            max-width: 380px
        }

        .cicon {
            font-size: 2.6rem;
            color: #fbbf24;
            margin-bottom: .8rem
        }

        .cbox h3 {
            font-size: 1.25rem;
            margin-bottom: .4rem
        }

        .cbox p {
            color: var(--mut);
            font-size: .9rem;
            line-height: 1.5;
            margin-bottom: 1.2rem
        }

        .acts {
            display: flex;
            gap: .6rem;
            justify-content: center;
            flex-wrap: wrap
        }

        .b {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 2rem;
            padding: .55rem 1.2rem;
            font-size: .85rem;
            font-weight: 600;
            transition: .2s
        }

        .b:hover {
            border-color: var(--ac);
            color: var(--ac)
        }

        .b.pri {
            background: linear-gradient(135deg, #5fd0ba, #3ab0a0);
            color: #070a0c;
            border-color: transparent
        }

        .b.pri:hover {
            color: #070a0c;
            transform: scale(1.04)
        }

        /* channel pill + number OSD */
        #info {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .4rem 1rem .4rem .8rem;
            border-radius: 2rem;
            max-width: 62vw;
            pointer-events: none
        }

        .dot {
            width: 10px;
            height: 10px;
            background: var(--red);
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse 1.8s ease-in-out infinite
        }

        @keyframes pulse {
            50% {
                opacity: .3;
                transform: scale(.8)
            }
        }

        #chNum {
            background: var(--ac);
            color: #070a0c;
            font-weight: 800;
            font-size: .75rem;
            padding: .05rem .5rem;
            border-radius: 1rem
        }

        #chName {
            font-weight: 700;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px
        }

        #chGroup {
            font-size: .65rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: .05em;
            padding-left: .5rem;
            border-left: 1px solid rgba(255, 255, 255, .1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px
        }

        #numOsd {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            z-index: 40;
            display: none;
            font-size: 3.2rem;
            font-weight: 800;
            color: var(--ac);
            text-shadow: 0 2px 14px #000;
            font-variant-numeric: tabular-nums
        }

        #numOsd.show {
            display: block
        }

        #hint {
            position: absolute;
            bottom: 6rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            font-size: .65rem;
            color: rgba(255, 255, 255, .35);
            letter-spacing: .04em;
            white-space: nowrap;
            pointer-events: none;
            transition: opacity .8s
        }

        #hint.off {
            opacity: 0
        }

        /* control bar */
        #controls {
            position: absolute;
            bottom: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: .2rem;
            padding: .4rem .8rem;
            border-radius: 3rem;
            max-width: 96vw;
            overflow-x: auto;
            scrollbar-width: none;
            transition: opacity .4s, transform .4s
        }

        #controls::-webkit-scrollbar {
            display: none
        }

        #controls.away {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none
        }

        .cb {
            position: relative;
            flex-shrink: 0;
            background: transparent;
            border: 0;
            color: var(--mut);
            font-size: 1rem;
            min-width: 38px;
            min-height: 38px;
            border-radius: .6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: .2s
        }

        .cb:hover {
            color: var(--ac);
            background: rgba(95, 208, 186, .08)
        }

        .cb.on {
            color: var(--ok)
        }

        .cb.on::after {
            content: '';
            position: absolute;
            top: 4px;
            right: 4px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ok)
        }

        .sep {
            flex-shrink: 0;
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, .08);
            margin: 0 .2rem
        }

        #vol {
            width: 56px;
            flex-shrink: 0;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, .15);
            border-radius: 2px;
            outline: none
        }

        #vol::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--ac)
        }

        #vol::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--ac);
            border: 0
        }

        /* number pad */
        #pad {
            position: absolute;
            bottom: 5.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 35;
            display: none;
            padding: .9rem;
            border-radius: 1.2rem;
            width: 220px;
            text-align: center
        }

        #pad.show {
            display: block
        }

        #padDisp {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--ac);
            height: 2.4rem;
            font-variant-numeric: tabular-nums
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .4rem
        }

        .grid button {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: .7rem;
            padding: .7rem 0;
            font-size: 1.1rem;
            font-weight: 600
        }

        .grid button:hover {
            border-color: var(--ac)
        }

        .grid button.pri {
            background: var(--ac);
            color: #070a0c
        }

        /* channel list */
        #popup {
            position: absolute;
            top: 50%;
            right: 1rem;
            transform: translateY(-50%) scale(.96);
            width: 420px;
            max-width: 88vw;
            max-height: 80vh;
            z-index: 50;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border-radius: 1.4rem;
            background: rgba(7, 10, 12, .96);
            border: 1px solid rgba(60, 130, 120, .12);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
            opacity: 0;
            transition: opacity .25s, transform .25s
        }

        #popup.show {
            display: flex;
            opacity: 1;
            transform: translateY(-50%) scale(1)
        }

        .ph {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .6rem .9rem;
            border-bottom: 1px solid rgba(255, 255, 255, .05)
        }

        .ph h4 {
            font-size: .8rem;
            color: var(--dim);
            white-space: nowrap
        }

        .ph h4 i {
            color: var(--ac);
            margin-right: .4rem
        }

        #count {
            font-size: .65rem;
            color: #2d8f7a;
            margin-left: .3rem
        }

        .sw {
            flex: 1;
            display: flex;
            align-items: center;
            gap: .4rem;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .05);
            border-radius: 2rem;
            padding: .1rem .3rem .1rem .7rem
        }

        .sw:focus-within {
            border-color: rgba(95, 208, 186, .3)
        }

        .sw i {
            color: var(--dim);
            font-size: .7rem
        }

        #q {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: 0;
            outline: 0;
            color: var(--fg);
            font-size: .8rem;
            padding: .35rem 0
        }

        #qx {
            display: none;
            background: none;
            border: 0;
            color: var(--dim);
            padding: .2rem .4rem
        }

        #qx.show {
            display: block
        }

        .pc {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .05);
            border: 0;
            flex-shrink: 0
        }

        .pc:hover {
            color: var(--red)
        }

        #pbody {
            flex: 1;
            overflow-y: auto;
            padding: .5rem
        }

        #pbody::-webkit-scrollbar {
            width: 4px
        }

        #pbody::-webkit-scrollbar-thumb {
            background: rgba(95, 208, 186, .2);
            border-radius: 4px
        }

        #now {
            position: sticky;
            top: -.5rem;
            z-index: 2;
            margin: -.5rem -.5rem .5rem;
            padding: .6rem .9rem;
            background: #0c1a18;
            border-bottom: 1px solid rgba(95, 208, 186, .25)
        }

        .nowlbl {
            font-size: .65rem;
            color: var(--ac);
            font-weight: 700;
            margin-bottom: .4rem
        }

        .nowrow,
        .irow {
            display: flex;
            align-items: center;
            gap: .7rem
        }

        .logo {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(8, 16, 20, .7);
            border: 1px solid rgba(60, 130, 120, .1);
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dim)
        }

        .logo img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0b1114
        }

        .ci {
            flex: 1;
            min-width: 0
        }

        .cn {
            font-size: .85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .cn b {
            color: var(--ac)
        }

        .cg {
            font-size: .6rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: .05em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .item {
            padding: .5rem .7rem;
            border-radius: .8rem;
            border: 1px solid transparent;
            margin-bottom: .2rem;
            cursor: pointer;
            transition: .2s
        }

        .item:hover {
            background: rgba(95, 208, 186, .05)
        }

        .item.active {
            background: rgba(95, 208, 186, .1);
            border-color: rgba(95, 208, 186, .35)
        }

        .num {
            min-width: 2rem;
            font-size: .75rem;
            font-weight: 700;
            color: var(--dim);
            text-align: right;
            font-variant-numeric: tabular-nums
        }

        .item.active .num {
            color: var(--ac)
        }

        .st {
            font-size: .6rem;
            color: var(--ac);
            font-weight: 700;
            white-space: nowrap
        }

        .sbs {
            display: flex;
            gap: .4rem;
            padding: .4rem 0 0 2.7rem;
            flex-wrap: wrap
        }

        .sb {
            background: transparent;
            border: 1px solid rgba(60, 130, 120, .2);
            border-radius: 1.5rem;
            padding: .15rem .75rem;
            font-size: .75rem;
            font-weight: 600;
            color: var(--dim)
        }

        .sb:hover,
        .sb.active {
            border-color: var(--ac);
            color: var(--ac)
        }

        .sb.active {
            background: rgba(95, 208, 186, .12)
        }

        .msg {
            text-align: center;
            padding: 1.6rem 1rem;
            color: var(--dim);
            font-size: .85rem
        }

        .msg button {
            background: none;
            border: 0;
            color: var(--ac);
            text-decoration: underline
        }

        #toast {
            position: fixed;
            top: 4.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: none;
            align-items: center;
            gap: .6rem;
            padding: .55rem 1.1rem;
            border-radius: 1rem;
            font-size: .8rem;
            max-width: 90vw
        }

        #toast.show {
            display: flex
        }

        #toast.success i {
            color: var(--ok)
        }

        #toast.error i {
            color: var(--red)
        }

        #toast.info i {
            color: var(--ac)
        }

        @media (max-width:600px) {

            #vol,
            .hide-m {
                display: none !important
            }

            #popup {
                right: .5rem;
                width: 94vw;
                max-width: 94vw;
                max-height: 72vh
            }

            #chGroup {
                display: none
            }

            #chName {
                max-width: 150px
            }

            #hint {
                display: none
            }

            .sbs {
                padding-left: 0
            }
        }
    </style>
</head>

<body>
    <div id="pc">
        <video id="player" class="hidden" playsinline></video>
        <iframe id="frame" class="hidden" title="Stream"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <div id="state" class="loading">
            <div class="ring"></div>
            <div class="stmsg">Connecting…</div>
        </div>

        <div id="info" class="glass"><span class="dot"></span><span id="chNum" class="hidden"></span><span
                id="chName">{{ channel_name }}</span><span id="chGroup">{{ channel_group }}</span></div>
        <div id="numOsd"></div>
        <div id="hint">0–9 channel number · ↑↓ next/previous · ←→ volume · M mute · L last · F fullscreen · C list</div>

        <div id="pad" class="glass">
            <div id="padDisp">—</div>
            <div class="grid">
                <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
                <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
                <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
                <button data-d="back" title="Delete"><i class="fas fa-backspace"></i></button><button
                    data-d="0">0</button><button data-d="go" class="pri" title="Go"><i
                        class="fas fa-check"></i></button>
            </div>
        </div>

        <div id="controls" class="glass">
            <a class="cb" href="/viulive/" title="Back"><i class="fas fa-chevron-left"></i></a>
            <button class="cb" data-a="list" title="Channels (C)"><i class="fas fa-list-ul"></i></button>
            <button class="cb" data-a="prev" title="Previous channel (↓)"><i class="fas fa-step-backward"></i></button>
            <button class="cb" data-a="next" title="Next channel (↑)"><i class="fas fa-step-forward"></i></button>
            <button class="cb" data-a="pad" title="Enter channel number"><i class="fas fa-th"></i></button>
            <button class="cb" data-a="last" title="Last channel (L)"><i class="fas fa-undo"></i></button>
            <button class="cb" data-a="refresh" title="Reload stream (R)"><i class="fas fa-sync-alt"></i></button>
            <div class="sep"></div>
            <button class="cb" data-a="mute" title="Mute (M)"><i id="volIcon" class="fas fa-volume-up"></i></button>
            <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume" />
            <div class="sep"></div>
            <button class="cb" data-a="aspect" title="Picture size"><i class="fas fa-expand-arrows-alt"></i></button>
            <button class="cb" data-a="saver" title="Data saver"><i class="fas fa-tachometer-alt"></i></button>
            <button class="cb hide-m" data-a="pip" title="Picture in picture"><i
                    class="fas fa-external-link-square-alt"></i></button>
            <button class="cb" data-a="sleep" title="Sleep timer"><i class="fas fa-moon"></i></button>
            <div class="sep"></div>
            <button class="cb" data-a="fs" title="Fullscreen (F)"><i id="fsIcon" class="fas fa-expand"></i></button>
        </div>

        <div id="popup" class="glass">
            <div class="ph">
                <h4><i class="fas fa-tv"></i>Channels<span id="count">0</span></h4>
                <div class="sw"><i class="fas fa-search"></i><input id="q" type="text" placeholder="Search channels…"
                        autocomplete="off" /><button id="qx" title="Clear"><i class="fas fa-times"></i></button></div>
                <button class="pc" id="pclose" title="Close"><i class="fas fa-times"></i></button>
            </div>
            <div id="pbody">
                <div id="now"></div>
                <div id="list">
                    <div class="msg"><span class="ring sm"></span>Loading channels…</div>
                </div>
                <div id="results"></div>
                <div id="sent" style="height:1px"></div>
            </div>
        </div>

        <div id="toast" class="glass"></div>
    </div>

    <script>
        (function () {
            var $ = function (id) { return document.getElementById(id); };
            var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
            var PER = 50, EXT = /\.(mp4|m3u8|mpd|webm|mov|avi|mkv)$/i;
            var player = $('player'), frame = $('frame'), stateEl = $('state'), pc = $('pc');

            var App = {
                id: "{{ channel_id|escapejs }}", name: "{{ channel_name|escapejs }}", group: "{{ channel_group|escapejs }}", logo: '',
                stream: 1, streams: 1, url: null, index: null, tok: 0, tried: {}, playing: false, active: false,
                lastId: null, lastStream: 1, hls: null, dash: null, loadT: null, muted: false, fit: 0, saver: 0, sleep: 0, sleepT: null
            };

            /* ---------- helpers ---------- */
            function api(u) {
                return fetch(u, { headers: { 'Content-Type': 'application/json' } }).then(function (r) { return r.json(); })
                    .then(function (d) { if (!d.success) throw new Error(d.message || 'Request failed'); return d.data; });
            }
            function fetchCh(id, s) { return api('/api/viulive/channel/' + encodeURIComponent(id) + '/url/' + (s > 1 ? '?stream=' + s : '')).then(function (d) { return d.channel; }); }
            var tT;
            function toast(m, t) {
                var e = $('toast'); t = t || 'info';
                e.className = 'glass show ' + t;
                e.innerHTML = '<i class="fas fa-' + (t === 'error' ? 'exclamation-circle' : t === 'success' ? 'check-circle' : 'info-circle') + '"></i>' + esc(m);
                clearTimeout(tT); tT = setTimeout(function () { e.classList.remove('show'); }, 2500);
            }
            function logoHtml(l) { return '<div class="logo"><i class="fas fa-tv"></i>' + (l ? '<img src="' + esc(l) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div>'; }

            /* ---------- in-player states ---------- */
            function loading(msg) { stateEl.className = 'loading'; stateEl.innerHTML = '<div class="ring"></div><div class="stmsg">' + esc(msg) + '</div>'; }
            function buffering() { if (stateEl.className === 'card') return; stateEl.className = 'buffer'; stateEl.innerHTML = '<div class="ring"></div>'; }
            function clearState() { stateEl.className = ''; stateEl.innerHTML = ''; }
            function card(icon, title, desc, acts) {
                stateEl.className = 'card';
                stateEl.innerHTML = '<div class="cbox"><i class="fas fa-' + icon + ' cicon"></i><h3>' + esc(title) + '</h3><p>' + esc(desc) + '</p><div class="acts">' +
                    acts.map(function (a) { return '<button class="b' + (a[2] ? ' pri' : '') + '" data-act="' + a[0] + '">' + a[1] + '</button>'; }).join('') + '</div></div>';
            }
            stateEl.addEventListener('click', function (e) {
                var b = e.target.closest('[data-act]'); if (!b) return;
                var a = b.dataset.act;
                if (a === 'retry') reload();
                else if (a === 'stream') play(App.id, { stream: App.stream % App.streams + 1, idx: App.index });
                else if (a === 'next') step(1);
                else if (a === 'list') openPop();
                else if (a === 'open') window.open(App.url, '_blank');
                else if (a === 'play') tryPlay();
            });

            /* ---------- channel list data ---------- */
            var List = { pages: {}, total: 0, pageCount: 1 }, cache = {};
            function loadPage(p) {
                if (List.pages[p]) return Promise.resolve(List.pages[p]);
                return api('/api/viulive/channels/?page=' + p + '&per_page=' + PER).then(function (d) {
                    var pg = d.pagination || {};
                    List.total = pg.total_channels || List.total; List.pageCount = pg.total_pages || 1;
                    var arr = d.channels || []; arr.forEach(function (c) { cache[c.id] = c; });
                    return (List.pages[p] = arr);
                });
            }
            function meta() { return List.total ? Promise.resolve() : loadPage(1); }
            function chAt(i) { return loadPage(Math.floor(i / PER) + 1).then(function (a) { return a[i % PER] || null; }); }
            function locate(id) {
                return loadPage(1).then(function () {
                    var p = 1;
                    function next() {
                        if (p > List.pageCount) return -1;
                        return loadPage(p).then(function (arr) {
                            var k = arr.findIndex(function (c) { return String(c.id) === id; });
                            if (k > -1) return (p - 1) * PER + k;
                            p++; return next();
                        });
                    }
                    return next();
                });
            }
            function curIndex() { return App.index != null ? Promise.resolve(App.index) : locate(App.id).then(function (i) { return (App.index = i > -1 ? i : null) == null ? -1 : i; }); }

            /* ---------- now-playing info ---------- */
            function setInfo() {
                $('chName').textContent = App.name || 'Loading…';
                $('chGroup').textContent = App.group || '';
                var n = App.index != null ? App.index + 1 : '';
                $('chNum').textContent = n; $('chNum').classList.toggle('hidden', !n);
                document.title = 'LyxMab | ' + (App.name || 'ViuLive') + ' Player';
                $('now').innerHTML = '<div class="nowlbl"><i class="fas fa-play"></i> Now playing' + (App.streams > 1 ? ' · stream ' + App.stream + ' of ' + App.streams : '') + '</div>' +
                    '<div class="nowrow">' + logoHtml(App.logo) + '<div class="ci"><div class="cn">' + (n ? '<b>' + n + '</b> ' : '') + esc(App.name) + '</div><div class="cg">' + esc(App.group) + '</div></div></div>';
                refreshActive();
            }
            function pushUrl() {
                var u = '/viulive/watching/' + encodeURIComponent(App.id) + '/' + (App.stream > 1 ? '?stream=' + App.stream : '');
                if (u !== location.pathname + location.search && history.pushState) history.pushState({ id: App.id, stream: App.stream }, '', u);
            }

            /* ---------- playback ---------- */
            function play(id, o) {
                o = o || {}; id = String(id);
                var stream = o.stream || 1, tok = ++App.tok;
                destroy();
                if (!o.auto) App.tried = {};
                App.tried[stream] = 1;
                if (id !== App.id) {
                    App.lastId = App.id; App.lastStream = App.stream;
                    App.id = id; App.index = o.idx == null ? null : o.idx;
                    App.name = o.name || ''; App.group = o.group || ''; App.logo = o.logo || ''; App.streams = 1;
                } else if (o.idx != null) App.index = o.idx;
                App.stream = stream; setInfo();
                loading('Loading ' + (App.name || 'channel') + '…');
                fetchCh(id, stream).then(function (ch) {
                    if (tok !== App.tok) return;
                    App.streams = ch.url_count || 1; App.url = ch.url; App.name = ch.name || 'Viu';
                    App.group = ch['group-title'] || ''; App.logo = ch.logo || App.logo;
                    setInfo(); pushUrl();
                    if (App.index == null) locate(id).then(function (i) { if (App.id === id && i > -1) { App.index = i; setInfo(); } }).catch(function () { });
                    start(ch.url, tok);
                }).catch(function () { fail(tok); });
            }
            function playCh(ch, idx, stream) {
                stream = stream || 1;
                if (String(ch.id) === App.id && stream === App.stream && App.playing) { closePop(); return; }
                play(ch.id, { stream: stream, idx: idx, name: ch.name, group: ch['group-title'], logo: ch.logo });
            }
            function reload() { play(App.id, { stream: App.stream, idx: App.index }); }

            function fail(tok) {
                if (tok !== App.tok) return;
                destroy();
                var next = 0;
                for (var s = 1; s <= App.streams; s++) if (!App.tried[s]) { next = s; break; }
                if (next) { toast('Stream ' + App.stream + ' failed, trying stream ' + next + '…'); play(App.id, { stream: next, auto: true, idx: App.index }); return; }
                var acts = [['retry', '<i class="fas fa-sync-alt"></i> Try again', 1]];
                if (App.streams > 1) acts.push(['stream', 'Other stream']);
                acts.push(['next', 'Next channel'], ['list', 'Channels']);
                card('exclamation-triangle', 'This channel can’t be played right now', 'The stream is offline or unreachable. Try again in a moment, or switch to another channel.', acts);
            }
            function ready() { clearTimeout(App.loadT); App.playing = true; clearState(); }
            function tryPlay() {
                var p = player.play();
                if (p && p.catch) p.catch(function (e) {
                    if (e && e.name === 'NotAllowedError') { clearTimeout(App.loadT); card('play-circle', 'Tap to play', 'Your browser blocked autoplay with sound.', [['play', '<i class="fas fa-play"></i> Play', 1]]); }
                });
            }
            player.addEventListener('playing', function () { if (App.active) ready(); });
            player.addEventListener('waiting', function () { if (App.active && App.playing) buffering(); });
            player.addEventListener('error', function () { if (App.active) fail(App.tok); });

            function start(url, tok) {
                App.active = true;
                if (!url) { fail(tok); return; }
                var port = ''; try { port = new URL(url).port; } catch (e) { }
                if (port) { clearTimeout(App.loadT); card('external-link-alt', 'Opens in a new tab', 'This channel plays on an external page.', [['open', 'Open channel', 1], ['next', 'Next channel']]); return; }
                App.loadT = setTimeout(function () { fail(tok); }, 20000);
                var m = (url.split(/[?#]/)[0].match(EXT) || [])[1], ext = (m || '').toLowerCase();
                if (ext === 'm3u8') hls(url, tok); else if (ext === 'mpd') dash(url, tok);
                else if (m) { player.classList.remove('hidden'); player.src = url; tryPlay(); }
                else { frame.classList.remove('hidden'); frame.onload = function () { if (App.active) ready(); }; frame.src = url; }
            }
            function hls(url, tok) {
                player.classList.remove('hidden');
                if (window.Hls && Hls.isSupported()) {
                    var h = App.hls = new Hls({ maxBufferLength: 30, backBufferLength: 30, maxMaxBufferLength: 60, maxBufferSize: 60e6, startLevel: -1, abrBandWidthFactor: .8, abrBandWidthUpFactor: .7, fragLoadingMaxRetry: 6, manifestLoadingMaxRetry: 4, levelLoadingMaxRetry: 4, xhrSetup: function (x) { x.withCredentials = false; } });
                    var nr = 0, mr = 0;
                    h.loadSource(url); h.attachMedia(player);
                    h.on(Hls.Events.MANIFEST_PARSED, function () { applySaver(); tryPlay(); });
                    h.on(Hls.Events.ERROR, function (e, d) {
                        if (!d.fatal) return;
                        if (d.type === Hls.ErrorTypes.NETWORK_ERROR && nr++ < 3) { h.startLoad(); return; }
                        if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mr++ < 2) { h.recoverMediaError(); return; }
                        fail(tok);
                    });
                } else if (player.canPlayType('application/vnd.apple.mpegurl')) { player.src = url; tryPlay(); }
                else fail(tok);
            }
            function dash(url, tok) {
                player.classList.remove('hidden');
                try { var d = App.dash = dashjs.MediaPlayer().create(); d.initialize(player, url, true); d.on('error', function () { fail(tok); }); } catch (e) { fail(tok); }
            }
            function destroy() {
                App.active = false; App.playing = false; clearTimeout(App.loadT);
                if (App.hls) { App.hls.destroy(); App.hls = null; }
                if (App.dash) { App.dash.reset(); App.dash = null; }
                frame.onload = null; frame.src = 'about:blank'; frame.classList.add('hidden');
                player.pause(); player.removeAttribute('src'); player.load(); player.classList.add('hidden');
            }

            /* ---------- channel navigation ---------- */
            function step(d) {
                meta().then(function () {
                    if (!List.total) throw 0;
                    return curIndex().then(function (i) {
                        if (i < 0) throw 0;
                        var j = (i + d + List.total) % List.total;
                        return chAt(j).then(function (ch) { if (ch) playCh(ch, j); });
                    });
                }).catch(function () { toast('Could not change channel', 'error'); });
            }
            function goNumber(n) {
                meta().then(function () {
                    if (n > List.total) { toast('No channel ' + n, 'error'); return; }
                    return chAt(n - 1).then(function (ch) { if (ch) playCh(ch, n - 1); });
                }).catch(function () { toast('Could not load channel ' + n, 'error'); });
            }
            function lastChannel() { if (!App.lastId) { toast('No previous channel'); return; } play(App.lastId, { stream: App.lastStream }); }

            /* number entry (keyboard or on-screen pad) */
            var buf = '', bufT, padOpen = false;
            function showBuf() { $('numOsd').textContent = buf; $('numOsd').classList.toggle('show', !!buf); $('padDisp').textContent = buf || '—'; }
            function digit(d) {
                if (buf.length >= 4) return; buf += d; showBuf(); clearTimeout(bufT);
                if (!padOpen) bufT = setTimeout(commitNum, 1800);
            }
            function commitNum() { clearTimeout(bufT); var n = parseInt(buf, 10); buf = ''; showBuf(); if (n >= 1) goNumber(n); }
            function cancelNum() { clearTimeout(bufT); buf = ''; showBuf(); }
            function togglePad(force) { padOpen = force == null ? !padOpen : force; $('pad').classList.toggle('show', padOpen); if (padOpen) closePop(); else cancelNum(); }
            $('pad').addEventListener('click', function (e) {
                var b = e.target.closest('[data-d]'); if (!b) return; var d = b.dataset.d;
                if (d === 'back') { buf = buf.slice(0, -1); showBuf(); } else if (d === 'go') { commitNum(); togglePad(false); } else digit(d);
            });

            /* ---------- TV settings ---------- */
            var SAVER = [['Off', -1], ['Light', .6], ['Medium', .3], ['Maximum', 0]], FIT = [['Fit', 'contain'], ['Fill', 'cover'], ['Stretch', 'fill']], SLEEP = [0, 15, 30, 60, 90];
            function applySaver() { var h = App.hls; if (!h || !h.levels || !h.levels.length) return; var f = SAVER[App.saver][1]; h.currentLevel = f < 0 ? -1 : Math.round((h.levels.length - 1) * f); }
            function setVol(v) { v = Math.max(0, Math.min(100, v)); player.volume = v / 100; $('vol').value = v; if (v > 0 && App.muted) setMute(false, true); volIcon(); toast('Volume ' + v + '%'); }
            function setMute(m, quiet) { App.muted = m; player.muted = m; volIcon(); if (!quiet) toast(m ? 'Muted' : 'Unmuted'); }
            function volIcon() { var v = +$('vol').value; $('volIcon').className = 'fas fa-volume-' + (App.muted || v === 0 ? 'mute' : v < 50 ? 'down' : 'up'); }
            function fs() {
                var d = document;
                if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
                else { var f = pc.requestFullscreen || pc.webkitRequestFullscreen; if (f) Promise.resolve(f.call(pc)).catch(function () { }); }
            }
            document.addEventListener('fullscreenchange', function () { $('fsIcon').className = 'fas fa-' + (document.fullscreenElement ? 'compress' : 'expand'); });
            function setSleep() {
                App.sleep = (App.sleep + 1) % SLEEP.length; clearTimeout(App.sleepT);
                var m = SLEEP[App.sleep];
                document.querySelector('[data-a=sleep]').classList.toggle('on', m > 0);
                if (!m) { toast('Sleep timer off'); return; }
                toast('Sleep timer: ' + m + ' min');
                App.sleepT = setTimeout(function () {
                    App.tok++; destroy(); App.sleep = 0; document.querySelector('[data-a=sleep]').classList.remove('on');
                    card('moon', 'Sleep timer ended', 'Playback was stopped.', [['retry', '<i class="fas fa-play"></i> Resume', 1]]);
                }, m * 60000);
            }
            $('controls').addEventListener('click', function (e) {
                var b = e.target.closest('[data-a]'); if (!b) return; var a = b.dataset.a;
                if (a === 'list') togglePop();
                else if (a === 'prev') step(-1); else if (a === 'next') step(1);
                else if (a === 'pad') togglePad();
                else if (a === 'last') lastChannel();
                else if (a === 'refresh') { toast('Reloading stream…'); reload(); }
                else if (a === 'mute') setMute(!App.muted);
                else if (a === 'aspect') { App.fit = (App.fit + 1) % FIT.length; player.style.objectFit = FIT[App.fit][1]; toast('Picture: ' + FIT[App.fit][0]); }
                else if (a === 'saver') { App.saver = (App.saver + 1) % SAVER.length; applySaver(); b.classList.toggle('on', App.saver > 0); toast('Data saver: ' + SAVER[App.saver][0]); }
                else if (a === 'pip') { if (document.pictureInPictureEnabled && App.playing && !player.classList.contains('hidden')) player.requestPictureInPicture().catch(function () { }); else toast('Picture in picture isn’t available', 'error'); }
                else if (a === 'sleep') setSleep();
                else if (a === 'fs') fs();
            });
            $('vol').addEventListener('input', function () { setVol(+this.value); });

            /* ---------- channel list popup ---------- */
            var P = { open: false, next: 1, pr: null, idle: null, q: '' };
            function itemHtml(ch, idx) {
                var n = ch.number || (idx != null ? idx + 1 : ''), s = '';
                if ((ch.url_count || 1) > 1) { s = '<div class="sbs">'; for (var i = 1; i <= ch.url_count; i++) s += '<button class="sb" data-s="' + i + '">' + i + '</button>'; s += '</div>'; }
                return '<div class="item" data-id="' + esc(ch.id) + '"' + (idx != null ? ' data-i="' + idx + '"' : '') + '><div class="irow"><span class="num">' + esc(n) + '</span>' + logoHtml(ch.logo) +
                    '<div class="ci"><div class="cn">' + esc(ch.name || 'Viu') + '</div><div class="cg">' + esc(ch['group-title'] || '') + '</div></div><span class="st"></span></div>' + s + '</div>';
            }
            function refreshActive() {
                document.querySelectorAll('.item').forEach(function (el) {
                    var a = el.dataset.id === App.id;
                    el.classList.toggle('active', a); el.querySelector('.st').textContent = a ? '► Playing' : '';
                    el.querySelectorAll('.sb').forEach(function (b) { b.classList.toggle('active', a && +b.dataset.s === App.stream); });
                });
            }
            function popMore() {
                if (P.pr) return P.pr;
                if (P.next > 1 && P.next > List.pageCount) return Promise.resolve();
                var p = P.next;
                P.pr = loadPage(p).then(function (arr) {
                    if (p === 1) $('list').innerHTML = '';
                    $('list').insertAdjacentHTML('beforeend', arr.map(function (c, k) { return itemHtml(c, (p - 1) * PER + k); }).join(''));
                    P.next = p + 1; $('count').textContent = List.total; refreshActive();
                }).catch(function () {
                    if (p === 1) $('list').innerHTML = '<div class="msg">Couldn’t load channels. <button id="retryList">Try again</button></div>';
                }).then(function () { P.pr = null; });
                return P.pr;
            }
            function revealActive() {
                curIndex().then(function (i) {
                    if (i < 0) return;
                    var need = Math.floor(i / PER) + 1;
                    function go() {
                        if (!P.open || P.q || P.next > need) return;
                        var before = P.next;
                        return popMore().then(function () { if (P.next !== before) return go(); });
                    }
                    return Promise.resolve(go()).then(function () {
                        refreshActive(); var el = document.querySelector('#list .item.active');
                        if (el && P.open) el.scrollIntoView({ block: 'center' });
                    });
                }).catch(function () { });
            }
            function bumpIdle() { clearTimeout(P.idle); P.idle = setTimeout(function () { if ($('q').value) bumpIdle(); else closePop(); }, 20000); }
            function openPop() { togglePad(false); P.open = true; $('popup').classList.add('show'); bumpIdle(); if (P.next === 1) popMore(); refreshActive(); revealActive(); }
            function closePop() { P.open = false; clearTimeout(P.idle); $('popup').classList.remove('show'); }
            function togglePop() { P.open ? closePop() : openPop(); }
            $('pclose').addEventListener('click', closePop);
            ['pointermove', 'keydown', 'input', 'click'].forEach(function (ev) { $('popup').addEventListener(ev, function () { if (P.open) bumpIdle(); }); });
            $('pbody').addEventListener('scroll', function () { if (P.open) bumpIdle(); }, { passive: true });
            $('pbody').addEventListener('click', function (e) {
                if (e.target.id === 'retryList') { P.next = 1; popMore(); return; }
                var el = e.target.closest('.item'); if (!el) return;
                var ch = cache[el.dataset.id]; if (!ch) return;
                var sb = e.target.closest('.sb');
                playCh(ch, el.dataset.i != null ? +el.dataset.i : null, sb ? +sb.dataset.s : 1);
                if (innerWidth < 600) closePop();
            });
            document.addEventListener('click', function (e) {
                if (P.open && !$('popup').contains(e.target) && !e.target.closest('[data-a=list]') && !e.target.closest('[data-act=list]')) closePop();
                if (padOpen && !$('pad').contains(e.target) && !e.target.closest('[data-a=pad]')) togglePad(false);
            });
            new IntersectionObserver(function (es) { if (es.some(function (x) { return x.isIntersecting; }) && P.open && !P.q) popMore(); }, { root: $('pbody'), rootMargin: '0px 0px 80px 0px' }).observe($('sent'));

            var qT;
            $('q').addEventListener('input', function () { var v = this.value.trim(); $('qx').classList.toggle('show', !!v); clearTimeout(qT); qT = setTimeout(function () { search(v); }, 300); });
            $('qx').addEventListener('click', function () { $('q').value = ''; $('qx').classList.remove('show'); search(''); $('q').focus(); });
            function search(v) {
                P.q = v;
                if (!v) { $('results').innerHTML = ''; $('list').classList.remove('hidden'); refreshActive(); return; }
                $('list').classList.add('hidden');
                $('results').innerHTML = '<div class="msg"><span class="ring sm"></span>Searching…</div>';
                api('/api/viulive/channels/search/?q=' + encodeURIComponent(v)).then(function (d) {
                    if (P.q !== v) return;
                    var arr = d.channels || [];
                    if (!arr.length) { $('results').innerHTML = '<div class="msg">No channels found for “' + esc(v) + '”</div>'; return; }
                    arr.forEach(function (c) { cache[c.id] = c; });
                    $('results').innerHTML = arr.map(function (c) { return itemHtml(c, null); }).join(''); refreshActive();
                }).catch(function () { if (P.q === v) $('results').innerHTML = '<div class="msg">Search failed. Try again.</div>'; });
            }

            /* ---------- keyboard ---------- */
            document.addEventListener('keydown', function (e) {
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                var typing = e.target.tagName === 'INPUT' && e.target.type === 'text';
                if (e.key === 'Escape') { if (buf) cancelNum(); else if (padOpen) togglePad(false); else closePop(); return; }
                if (typing) return;
                var k = e.key;
                if (/^[0-9]$/.test(k)) { digit(k); return; }
                if (k === 'Enter' && buf) { commitNum(); return; }
                if (k === 'Backspace' && buf) { buf = buf.slice(0, -1); showBuf(); return; }
                if (k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); step(1); }
                else if (k === 'ArrowDown' || k === 'PageDown') { e.preventDefault(); step(-1); }
                else if (k === 'ArrowRight') { e.preventDefault(); setVol(+$('vol').value + 5); }
                else if (k === 'ArrowLeft') { e.preventDefault(); setVol(+$('vol').value - 5); }
                else if (/^m$/i.test(k)) setMute(!App.muted);
                else if (/^f$/i.test(k)) fs();
                else if (/^c$/i.test(k)) { e.preventDefault(); togglePop(); if (P.open) setTimeout(function () { $('q').focus(); }, 250); }
                else if (/^l$/i.test(k)) lastChannel();
                else if (/^r$/i.test(k)) { toast('Reloading stream…'); reload(); }
            });

            /* ---------- controls auto-hide, misc ---------- */
            var hideT;
            function wake() {
                $('controls').classList.remove('away'); clearTimeout(hideT);
                hideT = setTimeout(function () { if (!P.open && !padOpen) $('controls').classList.add('away'); }, 4000);
            }
            ['mousemove', 'touchstart', 'keydown', 'click'].forEach(function (ev) { document.addEventListener(ev, wake, { passive: true }); });
            setTimeout(function () { $('hint').classList.add('off'); }, 7000);

            window.addEventListener('popstate', function (e) { if (e.state && e.state.id) play(e.state.id, { stream: e.state.stream || 1 }); });

            if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                document.addEventListener('click', function () {
                    if (!document.fullscreenElement) fs();
                    try { screen.orientation.lock('landscape').catch(function () { }); } catch (e) { }
                }, { once: true });
            }

            /* ---------- init ---------- */
            player.volume = .8; wake(); setInfo();
            var s0 = parseInt(new URLSearchParams(location.search).get('stream'), 10) || 1;
            play(App.id, { stream: s0, name: App.name, group: App.group });
            loadPage(1).then(function () { $('count').textContent = List.total; }).catch(function () { });
        })();
    </script>
